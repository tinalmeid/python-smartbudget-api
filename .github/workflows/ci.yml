name: CI — python-smartbudget-api

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 📡 SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o código-fonte do repositório
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # 2. Configurar Python 3.12 e cache de dependências
      - uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Instalar dependências e rodar testes
      - name: 📦 Instalar Dependências
        run: |
          pip install --upgrade pip

          for svc in svc-usuarios svc-orcamento svc-previsao svc-notificacoes; do
            if [ -f "$svc/requirements.txt" ]; then
              echo "→ Instalando $svc/requirements.txt"
              pip install -r $svc/requirements.txt
            fi
          done

          pip install pytest pytest-asyncio pytest-cov httpx

          # Instalar python-multipart 0.0.20 para evitar conflito com FastAPI 0.100.0
          pip uninstall -y multipart 2>/dev/null || true
          pip install --force-reinstall python-multipart==0.0.20

      # 4. Rodar testes e gerar relatório de cobertura
      - name: 🧪 Rodar testes e gerar coverage.xml
        run: |
          echo "🧪 Verificando testes por serviço..."
          FALHOU=0

          # svc-usuarios usa o pytest.ini da raiz (gera coverage.xml na raiz)
          if find svc-usuarios -name "test_*.py" 2>/dev/null | grep -q .; then
            echo "▶️  svc-usuarios"
            pytest -v
            if [ $? -ne 0 ]; then FALHOU=1; fi
          else
            echo "ℹ️  svc-usuarios ainda sem testes"
          fi

          # Demais serviços rodam isolados, cada um com seu próprio pyproject.toml
          for svc in svc-orcamento svc-previsao svc-notificacoes; do
            if [ -f "$svc/requirements.txt" ] && find "$svc" -name "test_*.py" 2>/dev/null | grep -q .; then
              echo "▶️  $svc"
              (cd "$svc" && pytest app/tests -v)
              if [ $? -ne 0 ]; then FALHOU=1; fi

              # Reescreve o coverage.xml para o formato que o SonarCloud espera:
              # 1) filename completo desde a raiz (cache.py → svc-orcamento/app/cache.py)
              # 2) a tag base <source>app</source> vira <source>.</source>, senão o
              #    Sonar concatena base + filename e gera um caminho inexistente
              if [ -f "$svc/coverage.xml" ]; then
                sed -e "s|filename=\"|filename=\"$svc/app/|g" \
                    -e "s|<source>app</source>|<source>.</source>|g" \
                  "$svc/coverage.xml" > "coverage-${svc}.xml"
                echo "✅ coverage-${svc}.xml gerado com caminhos corrigidos"
              else
                echo "⚠️  $svc não gerou coverage.xml"
              fi
            else
              echo "ℹ️  $svc ainda não tem testes — pulando (dívida técnica futura)"
            fi
          done

          if [ $FALHOU -eq 1 ]; then
            echo "::error::Um ou mais serviços falharam nos testes."
            exit 1
          fi

      # 4b. Validação explícita de cobertura (gate visível no próprio pipeline)
      - name: ✅ Validar cobertura mínima
        run: |
          echo "📊 Validando cobertura dos serviços..."
          FALHOU_COV=0

          # Função: extrai o line-rate do coverage.xml e converte para %
          validar_cobertura() {
            local arquivo="$1"
            local servico="$2"
            local minimo="$3"

            if [ ! -f "$arquivo" ]; then
              echo "⚠️  $servico: $arquivo não encontrado — pulando"
              return
            fi

            # line-rate fica no <coverage line-rate="0.87..."> na 1ª ocorrência
            local rate
            rate=$(grep -o 'line-rate="[0-9.]*"' "$arquivo" | head -1 | grep -o '[0-9.]*')
            local pct
            pct=$(awk "BEGIN {printf \"%.2f\", $rate * 100}")

            echo "   → $servico: ${pct}% (mínimo: ${minimo}%)"

            # Compara pct >= minimo
            if awk "BEGIN {exit !($pct >= $minimo)}"; then
              echo "   ✅ $servico passou"
            else
              echo "   ❌ $servico abaixo do mínimo!"
              FALHOU_COV=1
            fi
          }

          validar_cobertura "coverage.xml" "svc-usuarios" 80
          validar_cobertura "coverage-svc-orcamento.xml" "svc-orcamento" 60

          if [ $FALHOU_COV -eq 1 ]; then
            echo "::error::Cobertura abaixo do mínimo em um ou mais serviços."
            exit 1
          fi

          echo "🎉 Cobertura validada com sucesso em todos os serviços!"

      # 5. Analisar código com SonarCloud
      - name: 📊 Análise SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.python.version=3.12
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    # Só roda o deploy se os testes passarem e for na branch main
    # 6. Deploy para AWS usando ECR e EC2
    name: 🚀 Deploy para AWS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # 7. Configurar AWS CLI com credenciais seguras
      - name: 🛠️ Configurar AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 8. Login no ECR para poder pushar as imagens Docker
      - name: 🖥️ Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 9. Build e push das imagens Docker para o ECR
      - name: 🏗️ Build e push das imagens
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for svc in svc-usuarios svc-orcamento svc-previsao svc-notificacoes; do
            docker build -t $ECR_REGISTRY/smartbudget-$svc:$IMAGE_TAG ./$svc
            docker push $ECR_REGISTRY/smartbudget-$svc:$IMAGE_TAG
            docker tag $ECR_REGISTRY/smartbudget-$svc:$IMAGE_TAG \
                       $ECR_REGISTRY/smartbudget-$svc:latest
            docker push $ECR_REGISTRY/smartbudget-$svc:latest
          done

      # 10. Conectar via SSH na instância EC2 e atualizar os containers Docker
      - name: 🚀 Deploy no EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /app/python-smartbudget-api
            docker compose pull
            docker compose up -d --remove-orphans
            sleep 15
            for port in 8001 8002 8003 8004; do
              curl -f http://localhost:$port/health || exit 1
            done
