# @file svc-orcamento/alembic.ini
# @description: Configuração do Alembic para migrations do svc-orcamento.
# @author: Tina de Almeida
# @date: Maio 2026

[alembic]
# Caminho para o diretório de migrations
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
# Definição dos loggers, ou seja, as fontes dos logs
keys = root,sqlalchemy,alembic

[handlers]
# Definição dos handlers, ou seja, os destinos dos logs
keys = console

[formatters]
# Definição dos formatadores, ou seja, os formatos dos logs
keys = generic

[logger_root]
# Configuração do logger raiz
level = WARN
handlers = console
qualname =

[logger_alembic]
# Configuração do logger do Alembic
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
# Configuração do logger do SQLAlchemy
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
# Configuração do handler de console, que exibe os logs no terminal
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
# Configuração do formatador genérico, que define o formato dos logs
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# @file Fim do arquivo svc-orcamento/alembic.ini
